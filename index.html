<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greylon - Where Tech Meets Sustainability</title>
  <meta name="description" content="Greylon - Your trusted partner for e-waste management, IT asset disposal, and refurbished IT equipment in Mumbai, India" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html,body,#root{height:100%;margin:0;scroll-behavior:smooth;}

    /* Logo Fix */
    .logo-img {
      height: 48px;     /* h-12  */
    }
    @media (min-width: 640px) { .logo-img { height: 56px; } } /* sm:h-14 */
    @media (min-width: 768px) { .logo-img { height: 64px; } } /* md:h-16 */

    /* Faster Ticker Animation */
    .ticker{animation:scroll 15s linear infinite;}
    .ticker:hover{animation-play-state:paused;}
    @keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);} }

    /* Card Hover */
    .card-hover{transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);}
    .card-hover:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 20px 40px -10px rgba(0,0,0,.15);}

    /* Gradient Animation */
    .gradient-animate{
      background:linear-gradient(-45deg,#10b981,#059669,#34d399,#6ee7b7);
      background-size:400% 400%;
      animation:gradient 8s ease infinite;
    }
    @keyframes gradient{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* Floating, Pulse, Fade */
    .float{animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);} }

    .pulse-slow{animation:pulse 1.5s infinite;}

    .fade-in{animation:fadeIn 0.4s ease-in;}
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }

    /* Scrollbar Hide */
    .scrollbar-hide::-webkit-scrollbar{display:none;}
  </style>
</head>

<body class="antialiased bg-white text-gray-900">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const {useState,useEffect}=React;

    function Greylon(){
      const [page,setPage]=useState("home");
      const [form,setForm]=useState({name:"",company:"",email:"",message:""});
      const [scrolled,setScrolled]=useState(false);
      const [menuOpen,setMenuOpen]=useState(false);

      useEffect(()=>{
        window.addEventListener("scroll",()=>setScrolled(window.scrollY>20));
      },[]);

      const nav=(p)=>{ setPage(p); setMenuOpen(false); window.scrollTo({top:0,behavior:"smooth"}); };

      return(
        <div className="font-sans min-h-screen">

          {/* NAVBAR */}
          <header className={`fixed w-full top-0 z-50 transition-all duration-300 
            ${scrolled ? "bg-white/95 backdrop-blur-md shadow-md py-2" : "bg-white py-3"}`}>
            
            <div className="max-w-7xl mx-auto px-4 flex items-center justify-between">

              {/* Logo */}
              <div className="flex items-center cursor-pointer" onClick={()=>nav("home")}>
                <img 
                  src="https://raw.githubusercontent.com/mesaqibkhan/NewfreshGreylon/main/logo.png?v=10"
                  alt="Greylon Logo"
                  className="h-20 sm:h-24 md:h-28 w-auto object-contain"
                />
              </div>

              {/* Desktop Menu */}
              <nav className="hidden md:flex space-x-6 text-gray-700 font-medium">
                {["home","services","products","epr","blog","about","contact"].map(p =>
                  <button 
                    key={p} 
                    onClick={()=>nav(p)}
                    className={`capitalize px-3 py-2 rounded-lg transition-all
                    ${page===p ? "text-green-600 font-semibold" : "hover:bg-green-50"}`}>
                    {p}
                  </button>
                )}
              </nav>

              {/* Mobile Menu */}
              <button onClick={()=>setMenuOpen(!menuOpen)} className="md:hidden p-2 rounded-lg hover:bg-gray-100">
                <i data-lucide={menuOpen?"x":"menu"} className="w-6 h-6"></i>
              </button>
            </div>

            {/* Mobile Dropdown */}
            {menuOpen && (
              <div className="md:hidden bg-white border-t shadow-lg">
                <div className="px-4 py-3 space-y-1">
                  {["home","services","products","epr","blog","about","contact"].map(p =>
                    <button 
                      key={p} 
                      onClick={()=>nav(p)}
                      className={`block w-full text-left px-3 py-2 rounded-lg text-base
                      ${page===p?"bg-green-600 text-white":"hover:bg-gray-100"}`}>
                      {p}
                    </button>
                  )}
                </div>
              </div>
            )}

          </header>

          {/* HOME */}
          {page==="home" && (
            <section 
              className="hero-section pt-36 sm:pt-40 md:pt-44 lg:pt-48 pb-16 relative overflow-hidden"
              style={{background:"linear-gradient(135deg,#f0fdf4,#dcfce7,#bbf7d0)"}}
            >

              <div className="max-w-7xl mx-auto px-4 text-center fade-in">

                <h1 className="text-4xl sm:text-5xl md:text-6xl font-bold text-gray-900 mb-6">
                  Simplifying E-Waste Management for IT Companies
                </h1>

                <p className="text-lg sm:text-xl text-gray-700 max-w-3xl mx-auto mb-10">
                  Trusted partner for IT Asset Disposition (ITAD) and e-waste recycling with secure data destruction and complete compliance.
                </p>

                <div className="flex flex-col sm:flex-row gap-4 justify-center">
                  <button onClick={()=>nav("contact")}
                    className="bg-green-600 text-white px-8 py-4 rounded-full shadow-xl hover:bg-green-700 transition">
                    Get a Free Quote
                  </button>

                  <button onClick={()=>nav("services")}
                    className="border-2 border-green-600 text-green-700 px-8 py-4 rounded-full hover:bg-green-600 hover:text-white transition">
                    Our Services
                  </button>
                </div>

              </div>
            </section>
          )}
		            {/* SERVICES */}
          {page==="services" && (
            <section className="pt-40 pb-20 bg-white min-h-screen">
              <div className="max-w-7xl mx-auto px-4">

                <h2 className="text-4xl md:text-5xl font-bold text-center mb-10 bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent">
                  Our Services
                </h2>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {[
                    {icon:"file-check",title:"E-Waste Listing",desc:"Detailed Excel asset listing for audit readiness."},
                    {icon:"recycle",title:"ITAD Disposal",desc:"Secure disposal with authorized recyclers."},
                    {icon:"shield",title:"Data Destruction",desc:"Certified digital & physical destruction."},
                    {icon:"leaf",title:"EPR Compliance",desc:"Form 6 & Green Certificate support."}
                  ].map((s,i)=>
                    <div key={i} className="bg-white p-6 rounded-3xl border shadow-md card-hover">
                      <div className="w-14 h-14 bg-green-600 text-white rounded-2xl flex items-center justify-center mb-4 float">
                        <i data-lucide={s.icon} className="w-7 h-7"></i>
                      </div>
                      <h3 className="text-xl font-bold mb-2">{s.title}</h3>
                      <p className="text-gray-700">{s.desc}</p>
                    </div>
                  )}
                </div>

              </div>
            </section>
          )}

          {/* PRODUCTS */}
          {page==="products" && (
            <section className="pt-40 pb-20 bg-gradient-to-br from-gray-50 to-green-50 min-h-screen">
              <div className="max-w-7xl mx-auto px-4">

                <h2 className="text-4xl md:text-5xl font-bold text-center mb-10 bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent">
                  Certified Refurbished IT Equipment
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {[
                    {name:"Dell Latitude 7490",spec:"i5 • 16GB • 512GB SSD",price:"₹22,000"},
                    {name:"HP EliteDesk 800 G3",spec:"i7 • 16GB • 256GB SSD",price:"₹18,500"},
                    {name:"Dell PowerEdge R440",spec:"Xeon • 32GB • 1TB HDD",price:"₹45,000"}
                  ].map((p,i)=>
                    <div key={i} className="bg-white p-8 rounded-3xl shadow-lg border card-hover">
                      
                      <h3 className="text-2xl font-bold text-gray-900 mb-2">{p.name}</h3>
                      <p className="text-gray-600 mb-2">{p.spec}</p>

                      <div className="text-3xl font-bold text-green-600 mb-6">{p.price}</div>

                      <button 
                        onClick={()=>nav("contact")} 
                        className="w-full bg-green-600 text-white py-3 rounded-xl hover:bg-green-700 transition">
                        Get Quote
                      </button>

                    </div>
                  )}
                </div>

              </div>
            </section>
          )}

          {/* EPR */}
          {page==="epr" && (
            <section className="pt-40 pb-20 bg-gradient-to-br from-amber-50 to-green-50 min-h-screen">
              <div className="max-w-4xl mx-auto px-4">

                <h2 className="text-4xl md:text-5xl font-bold text-center mb-10 bg-gradient-to-r from-amber-600 to-green-600 bg-clip-text text-transparent">
                  What is EPR?
                </h2>

                <div className="bg-white p-10 rounded-3xl shadow-xl">
                  <h3 className="text-3xl font-bold mb-4">Extended Producer Responsibility</h3>
                  <p className="text-gray-700 text-lg mb-6">
                    Producers must ensure environmentally sound disposal of post-consumer products.
                  </p>

                  <ul className="space-y-3 text-gray-700">
                    <li>✔ EPR Documentation</li>
                    <li>✔ Form 6 & Green Certificate</li>
                    <li>✔ CPCB Targets Fulfillment</li>
                  </ul>

                  <button 
                    onClick={()=>nav("contact")} 
                    className="mt-8 bg-green-600 text-white px-10 py-4 rounded-full hover:bg-green-700 transition">
                    Get EPR Assistance
                  </button>
                </div>

              </div>
            </section>
          )}

          {/* BLOG */}
          {page==="blog" && (
            <section className="pt-40 pb-20 bg-white min-h-screen">
              <div className="max-w-5xl mx-auto px-4">

                <h2 className="text-4xl md:text-5xl font-bold text-center mb-10 bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent">
                  E-Waste Awareness Blog
                </h2>

                {[
                  {title:"Why India Generates 3.2M Tons of E-Waste",date:"Nov 05, 2025"},
                  {title:"5 Ways to Extend Laptop Life",date:"Oct 15, 2025"},
                  {title:"Why Data Wiping Isn’t Enough",date:"Oct 10, 2025"}
                ].map((b,i)=>
                  <div key={i} className="bg-white p-6 rounded-3xl border shadow-md mb-6 card-hover">
                    <h3 className="text-2xl font-bold">{b.title}</h3>
                    <p className="text-gray-500 mb-4">{b.date}</p>
                    <button className="text-green-600 font-medium">Read More →</button>
                  </div>
                )}

              </div>
            </section>
          )}

          {/* ABOUT */}
          {page==="about" && (
            <section className="pt-40 pb-20 bg-gradient-to-br from-gray-50 to-green-50 min-h-screen">
              <div className="max-w-6xl mx-auto px-4">

                <h2 className="text-4xl md:text-5xl font-bold text-center mb-12 bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent">
                  About Greylon
                </h2>

                <div className="bg-white p-10 rounded-3xl shadow-xl mb-10">
                  <h3 className="text-3xl font-bold mb-4">Who We Are</h3>
                  <p className="text-gray-700">Greylon bridges IT companies with authorized recyclers for seamless e-waste management.</p>
                </div>

                <div className="bg-white p-10 rounded-3xl shadow-xl">
                  <h3 className="text-3xl font-bold mb-4">Vision</h3>
                  <p className="text-gray-700">To be India’s most trusted sustainable IT asset management partner.</p>
                </div>

              </div>
            </section>
          )}

          {/* CONTACT */}
          {page==="contact" && (
            <section className="pt-40 pb-20 bg-gradient-to-br from-gray-50 to-green-50 min-h-screen">
              <div className="max-w-6xl mx-auto px-4">

                <h2 className="text-4xl md:text-5xl font-bold text-center mb-12 bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent">
                  Get In Touch
                </h2>

                <div className="grid md:grid-cols-2 gap-8">

                  <div className="bg-white p-8 rounded-3xl shadow-xl">
                    <h3 className="text-2xl font-bold mb-6">Send us a message</h3>
                    <div className="space-y-4">
                      <input name="name" placeholder="Your Name" className="w-full border p-4 rounded-xl"/>
                      <input name="company" placeholder="Company Name" className="w-full border p-4 rounded-xl"/>
                      <input name="email" type="email" placeholder="Email Address" className="w-full border p-4 rounded-xl"/>
                      <textarea name="message" placeholder="Your Message" className="w-full border p-4 rounded-xl h-32"></textarea>

                      <button className="w-full bg-green-600 text-white py-4 rounded-xl hover:bg-green-700">
                        Send Message
                      </button>
                    </div>
                  </div>

                  <div className="bg-white p-8 rounded-3xl shadow-xl">
                    <h3 className="text-2xl font-bold mb-6">Contact Information</h3>
                    <p className="mb-4"><strong>Phone:</strong> +91 86576 99285</p>
                    <p className="mb-4"><strong>Email:</strong> greylonindia@gmail.com</p>
                    <p><strong>Location:</strong> Mumbai, Maharashtra</p>
                  </div>

                </div>

              </div>
            </section>
          )}

          {/* FOOTER */}
          <footer className="bg-gray-900 text-white py-10 mt-20">
            <div className="max-w-7xl mx-auto px-4 text-center">

              <img 
                src="https://raw.githubusercontent.com/mesaqibkhan/NewfreshGreylon/main/logo.png?v=10" 
                className="mx-auto h-16 mb-4"
              />

              <p className="text-gray-400">© 2025 Greylon. All Rights Reserved.</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Greylon />);
    setTimeout(() => window.lucide?.createIcons(), 100);
  </script>

</body>
</html>
